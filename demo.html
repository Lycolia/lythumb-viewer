<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lythumb-viewr — Demo</title>
    <link rel="stylesheet" href="dist/lythumb.min.css">
    <script defer src="dist/lythumb.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #f1f3f7;
            color: #202a39;
            font: 16px/1.7 system-ui, sans-serif
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 48px 24px
        }

        h1 {
            font-size: 40px;
            margin-bottom: 4px
        }

        p {
            color: #526071
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 24px 0 48px
        }

        .gallery a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 260px;
            height: 180px;
            background: #fff;
            border: 1px solid #ccd3df;
            border-radius: 12px;
            overflow: hidden
        }

        .gallery img {
            max-width: 100%;
            max-height: 100%
        }

        kbd {
            background: #fff;
            border: 1px solid #ccd3df;
            border-radius: 4px;
            padding: 2px 6px
        }

        footer {
            margin-top: 80px;
            padding-bottom: 400px
        }

        button {
            font: inherit;
            padding: 8px 16px
        }
    </style>
</head>

<body>
    <main>
        <h1>Lythumb-viewr</h1>
        <p>JSとCSSのみで動くリッチなlightbox</p>
        <p>画像クリックでフィット・原寸切替（スマートフォンは画像タップで操作ボタンの表示切替、ダブルタップで拡大）。ドラッグで移動、ホイール・矢印キーで前後移動。<kbd>G</kbd> 一覧、<kbd>F</kbd>
            全画面、<kbd>Esc</kbd> 閉じる。</p>
        <h2 id="gallery">ギャラリー / 横長・縦長・小画像</h2>
        <div class="gallery"><a href="assets/wide.svg" data-lythumb="demo"
                data-caption="横長のテスト画像。座標目盛りで拡大と移動を確認できます。"><img src="assets/wide.svg"
                    alt="横長のテスト画像。座標目盛りで拡大と移動を確認できます。"></a><a href="assets/tall.svg" data-lythumb="demo"
                data-caption="縦長のテスト画像"><img src="assets/tall.svg" alt="縦長のテスト画像"></a><a href="assets/small.svg"
                data-lythumb="demo" data-caption="小さい画像は原寸を超えて拡大しません。"><img src="assets/small.svg"
                    alt="小さい画像は原寸を超えて拡大しません。"></a></div>
        <h2>単体表示 / 空のグループ</h2>
        <div class="gallery"><a href="assets/wide.svg" data-lythumb data-caption="グループに含まれない単体画像"><img
                    src="assets/wide.svg" alt="グループに含まれない単体画像"></a></div>
        <h2>エラーからの移動</h2>
        <div class="gallery"><a href="assets/missing.png" data-lythumb="errors">読み込み失敗を確認</a><a href="assets/tall.svg"
                data-lythumb="errors" data-caption="エラーの次の正常画像"><img src="assets/tall.svg" alt="エラーの次の正常画像"></a></div>
        <button id="add">動的に画像を追加</button>
        <div class="gallery" id="dynamic"></div>
        <footer><a href="#gallery">通常のページ内アンカー</a></footer>
    </main>
    <script>document.querySelector('#add').onclick = () => { const a = document.createElement('a'); a.href = 'assets/wide.svg'; a.dataset.lythumb = 'dynamic'; a.dataset.caption = '動的に追加された画像'; const img = document.createElement('img'); img.src = 'assets/wide.svg'; img.alt = '動的に追加された画像'; a.append(img); document.querySelector('#dynamic').append(a); };</script>
</body>

</html>
